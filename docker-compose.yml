version: '2'
services:
  app:
    build:
        context: .
        dockerfile: Dockerfile
    volumes:
      - .:/app
    command: gradle linuxTest 
    volumes_from:
      - caches
  
  format:
    build:
        context: .
        dockerfile: Dockerfile.ktfmt
    volumes:
      - .:/app
    working_dir: /app
    command: java -jar /usr/local/bin/kfmt.jar --kotlinlang-style .

  caches:
    image: centos:7
    volumes:
      - ~/.gradle:/home/gradle/.gradle:rw
      - ~/.konan:/root/.konan:rw

